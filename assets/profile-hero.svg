<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Akari Sora (Sam Lung) — AI Agent Infrastructure, Mobile &amp; Web3 Systems</title>
  <desc id="desc">Animated system architecture banner connecting Multi-Agent Orchestration, Mobile/OS Engineering, and Web3/DeFi Systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#130a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090f1f" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="1200" height="440" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="26" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="437" rx="24.5" fill="none" stroke="#334155" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="1080" cy="70" r="190" fill="#7c3aed" opacity="0.11"/>
  <circle cx="620" cy="210" r="220" fill="#0284c7" opacity="0.07"/>
  <circle cx="80" cy="390" r="180" fill="#14b8a6" opacity="0.10"/>

  <!-- Top Status Pill -->
  <rect x="60" y="38" width="380" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <circle cx="82" cy="55" r="5.5" fill="#2dd4bf" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="98" y="60" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="13.5" font-weight="650" letter-spacing="1.4">AKARI SORA · SAM LUNG · TAIPEI, TW</text>

  <!-- Right Top Pill (Experience / Role) -->
  <rect x="926" y="38" width="214" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="1033" y="60" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600">13+ YRS · PROD &amp; OSS</text>

  <!-- Main Title -->
  <text x="60" y="132" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="50" font-weight="800" letter-spacing="-1">AI AGENT INFRASTRUCTURE</text>
  <rect x="60" y="149" width="840" height="4" rx="2" fill="url(#accent)"/>

  <!-- Subtitle & Tagline -->
  <text x="60" y="188" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="22" font-weight="550">Mobile Systems (Flutter · Android · iOS · KMP)  ·  Web3 &amp; DeFi  ·  Tech Creator</text>
  <text x="60" y="218" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="16">Building provider-agnostic multi-agent harnesses, local-first mobile/OS tools, and verifiable on-chain systems.</text>

  <!-- Connector Lines Between Bento Cards -->
  <path d="M 392 292 L 438 292" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 430 286 L 440 292 L 430 298" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="415" cy="292" r="3.5" fill="#2dd4bf" filter="url(#glow)">
    <animate attributeName="cx" values="394;436;394" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <path d="M 762 292 L 808 292" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 800 286 L 810 292 L 800 298" fill="none" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="785" cy="292" r="3.5" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="cx" values="764;806;764" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Card 1: Agent Harness -->
  <g>
    <rect x="60" y="244" width="332" height="96" rx="16" fill="url(#cardGrad)" stroke="#2dd4bf" stroke-opacity="0.65" stroke-width="1.4"/>
    <text x="84" y="273" fill="#5eead4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" letter-spacing="1.1">01 // AGENT INFRASTRUCTURE</text>
    <text x="84" y="299" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="18" font-weight="650">Multi-Agent · MCP · CLI · Resume</text>
    <text x="84" y="322" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="13.5">Provider routing, context handoff &amp; QA gates</text>
  </g>

  <!-- Card 2: Mobile & Systems -->
  <g>
    <rect x="440" y="244" width="322" height="96" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.4"/>
    <text x="464" y="273" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" letter-spacing="1.1">02 // MOBILE &amp; OS SYSTEMS</text>
    <text x="464" y="299" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="18" font-weight="650">Flutter · Android · iOS · KMP</text>
    <text x="464" y="322" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="13.5">OBD2 telemetry, UEFI boot &amp; local automation</text>
  </g>

  <!-- Card 3: Web3 & DeFi -->
  <g>
    <rect x="810" y="244" width="330" height="96" rx="16" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.65" stroke-width="1.4"/>
    <text x="834" y="273" fill="#d8b4fe" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" letter-spacing="1.1">03 // WEB3 &amp; SECURITY</text>
    <text x="834" y="299" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="18" font-weight="650">Flash-Swap Arb · Safe Exit · Wallets</text>
    <text x="834" y="322" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="13.5">Non-custodial architecture &amp; read-only guards</text>
  </g>

  <!-- Bottom Terminal Command Bar -->
  <rect x="60" y="362" width="1080" height="44" rx="12" fill="#070d19" stroke="#1e293b" stroke-width="1.2"/>
  <circle cx="84" cy="384" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="100" cy="384" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="116" cy="384" r="5" fill="#10b981" opacity="0.8"/>
  <text x="140" y="389" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5">$</text>
  <text x="156" y="389" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5">plan → orchestrate-agents → preserve-context → verify-with-evidence → ship</text>
  <rect x="760" y="376" width="8" height="16" rx="1.5" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="1118" y="389" text-anchor="end" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">canonical: gitlab.com/aa22396584</text>
</svg>
